<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Harvester | Qrion Research Lab</title>
    <meta name="description" content="Single-click YouTube channel and playlist audio, transcript, and screenshot extractor">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header with logo and title -->
    <header class="glass-header">
        <h1><i class="fas fa-seedling"></i> YouTube Harvester</h1>
        <p class="subtitle">Extract audio, transcripts & screenshots from any channel or playlist</p>
    </header>

    <main>
        <!-- Section 1: URL Input -->
        <section id="input-section" class="glass-card">
            <div class="input-group">
                <i class="fab fa-youtube input-icon"></i>
                <input type="text" id="url-input" placeholder="Paste YouTube channel, playlist, or video URL..." autocomplete="off">
                <button id="btn-scan" class="btn-primary"><i class="fas fa-search"></i> Scan</button>
            </div>
        </section>

        <!-- Section 2: Extraction Options -->
        <section id="options-section" class="glass-card fade-in" style="display:none;">
            <h2>Extraction Options</h2>
            <div class="options-grid">
                <div class="option-item">
                    <label class="toggle-label">
                        <input type="checkbox" id="opt-audio" checked>
                        <span class="toggle-switch"></span>
                        <span><i class="fas fa-headphones"></i> Audio (MP3)</span>
                    </label>
                </div>
                <div class="option-item">
                    <label class="toggle-label">
                        <input type="checkbox" id="opt-transcript" checked>
                        <span class="toggle-switch"></span>
                        <span><i class="fas fa-file-alt"></i> Transcripts</span>
                    </label>
                </div>
                <div class="option-item">
                    <label class="toggle-label">
                        <input type="checkbox" id="opt-screenshots">
                        <span class="toggle-switch"></span>
                        <span><i class="fas fa-camera"></i> Screenshots</span>
                    </label>
                    <div id="screenshot-slider-wrap" style="display:none; margin-top:0.5rem; align-items:center; gap:1rem;">
                        <input type="range" id="screenshot-count" min="1" max="10" value="5" style="width:100px;">
                        <span id="screenshot-count-label" style="font-size:0.9rem;">5 frames</span>
                    </div>
                </div>
                <div class="option-item">
                    <label style="font-weight:500; display:flex; align-items:center; gap:0.5rem;"><i class="fas fa-list-ol"></i> Max videos:</label>
                    <input type="number" id="opt-limit" min="1" max="500" placeholder="All" style="background:rgba(255,255,255,0.1); border-radius:4px; padding:0.4rem; max-width:80px;">
                </div>
            </div>
        </section>

        <!-- Section 3: Video Preview List -->
        <section id="preview-section" class="glass-card fade-in" style="display:none;">
            <div class="preview-header">
                <h2 id="preview-title">Videos Found</h2>
                <span id="preview-count" class="badge"></span>
            </div>
            <div id="video-preview-list" class="video-list">
                <!-- Populated dynamically -->
            </div>
            <div class="action-bar">
                <button id="btn-extract" class="btn-primary" style="font-size:1.1rem; padding:1rem 2rem;"><i class="fas fa-bolt"></i> Extract All</button>
            </div>
        </section>

        <!-- Section 4: Live Progress Terminal -->
        <section id="progress-section" class="glass-card fade-in" style="display:none;">
            <h2><i class="fas fa-terminal"></i> Extraction Progress</h2>
            <div class="progress-bar-wrap">
                <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
            </div>
            <span id="progress-text">0 / 0 videos processed</span>
            <div id="terminal-log" class="terminal-log">
                <!-- Live SSE log lines appended here -->
            </div>
        </section>

        <!-- Section 5: Results -->
        <section id="results-section" class="glass-card fade-in" style="display:none;">
            <div class="preview-header">
                <h2><i class="fas fa-check-circle" style="color:var(--accent-green);"></i> Extraction Complete</h2>
                <button id="btn-open-folder" class="btn-secondary"><i class="fas fa-folder-open"></i> Open Output Folder</button>
            </div>
            <div id="results-summary" class="results-summary" style="margin-bottom:1rem; color:var(--text-secondary);">
                <!-- Summary stats -->
            </div>
            <div id="results-list" class="results-grid">
                <!-- Result cards with audio player, transcript preview, screenshot thumbnails -->
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
